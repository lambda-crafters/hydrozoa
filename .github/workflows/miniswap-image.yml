name: MiniSwap image

# lambda-crafters fork only: publishes this fork's Hydrozoa build (with the remote-ledger digests
# bootstrap input MiniSwap needs) to ghcr.io/lambda-crafters/hydrozoa, so the MiniSwap devnet in
# lambda-crafters/gummiworm-scaling can pull it instead of every developer building Scala locally.
#
# Tags: the branch name with `/` turned into `-` (e.g. `miniswap-remote-ledger-digests`), and
# `sha-<short>` for an exact build. Same build as upstream's release workflow, minus the release
# notes step.
on:
  push:
    branches:
      - "miniswap/**"
  workflow_dispatch:

jobs:
  publish-image:
    if: github.repository_owner == 'lambda-crafters'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags so BuildInfo's `git describe` resolves
          persist-credentials: false

      - name: Install Nix
        timeout-minutes: 5
        run: .github/scripts/install-nix.sh

      - name: Stage the Docker build context
        run: nix develop .#ci --command sbt --server --batch Docker/stage

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/lambda-crafters/hydrozoa
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: target/docker/stage
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
